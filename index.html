<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azië 2027</title>
<meta name="description" content="Reisportaal voor de sabbatical van Luuk en Vera: planning, to-do's, vluchten, kosten en tours.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230E7A6C'/%3E%3Cpath d='M9 20 L15 10 L19 16 L23 12' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#E9EEEB; --ink:#17262B; --muted:#5E6F75; --line:#D9DFDC;
  --accent:#0E7A6C; --accent-ink:#FFFFFF; --accent-soft:#D9EEE9;
  --warn:#B4541F; --warn-soft:#F6E3D6; --ok:#2F8F5B; --ok-soft:#DDEFE3; --danger:#B2382C;
  --c-china:#C8503C; --c-japan:#D86A8A; --c-vietnam:#2F8F5B; --c-maleisie:#D99A2B; --c-indonesie:#2E7FB8; --c-nederland:#7A8690;
  --shadow:0 10px 30px -18px rgba(23,38,43,.35);
  --r-s:6px; --r-m:12px; --r-l:20px;
  --font-ui:"Instrument Sans",system-ui,sans-serif; --font-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10191C; --surface:#172327; --surface-2:#1E2C31; --ink:#E8EEEC; --muted:#93A4A9; --line:#2A383D;
  --accent:#3FB8A5; --accent-ink:#0B1A18; --accent-soft:#1B3A37;
  --warn:#E89A5C; --warn-soft:#3C2A1C; --ok:#5EC48A; --ok-soft:#1C3A2A; --danger:#E5705F;
  --c-china:#E0695A; --c-japan:#E88AA5; --c-vietnam:#54B57E; --c-maleisie:#E6B04E; --c-indonesie:#5AA2D6; --c-nederland:#9AA7AF;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#10191C; --surface:#172327; --surface-2:#1E2C31; --ink:#E8EEEC; --muted:#93A4A9; --line:#2A383D;
  --accent:#3FB8A5; --accent-ink:#0B1A18; --accent-soft:#1B3A37;
  --warn:#E89A5C; --warn-soft:#3C2A1C; --ok:#5EC48A; --ok-soft:#1C3A2A; --danger:#E5705F;
  --c-china:#E0695A; --c-japan:#E88AA5; --c-vietnam:#54B57E; --c-maleisie:#E6B04E; --c-indonesie:#5AA2D6; --c-nederland:#9AA7AF;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;min-height:100dvh}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
h1{font-size:clamp(26px,4vw,38px);font-weight:700}
h2{font-size:22px}
h3{font-size:17px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{max-width:1120px;margin:0 auto;padding:0 16px 80px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 10px;flex-wrap:wrap}
.brand small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.status .who{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--warn)} .dot.err{background:var(--danger)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button .n{font-size:12px;opacity:.7;margin-left:4px}

/* ---------- common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.hoog{color:var(--danger);border-color:var(--danger);background:transparent}
.chip.laag{color:var(--muted)}
.chip.country{color:#fff;border-color:transparent}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;min-width:0}
.filters input[type=search]{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-l)}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
.num{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em}
.num small{font-size:14px;font-weight:500;color:var(--muted);font-family:var(--font-ui);letter-spacing:0;margin-left:4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:600;border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-m);padding:10px 14px;font-size:14px;margin-bottom:16px}
.banner a{color:inherit}

/* ---------- route ribbon ---------- */
.ribbon{display:flex;height:54px;border-radius:var(--r-m);overflow:hidden;gap:2px}
.ribbon .seg-c{display:flex;gap:2px;min-width:0}
.ribbon .seg-c b{display:block;position:relative;background:var(--c);min-width:3px;cursor:pointer;transition:filter .15s}
.ribbon .seg-c b:hover{filter:brightness(1.12)}
.ribbon .seg-c b.now::after{content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:3px}
.ribbon-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.ribbon-legend span{display:inline-flex;align-items:center;gap:6px}
.ribbon-legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.ribbon-tip{font-size:13px;color:var(--muted);min-height:20px;margin-top:8px}

/* ---------- map ---------- */
.map{height:min(70vh,520px);border-radius:var(--r-m);overflow:hidden;background:var(--surface-2);position:relative;z-index:0}
.map .leaflet-container{font-family:var(--font-ui);background:var(--surface-2)}
.map .tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.stop{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font:600 12px var(--font-display);cursor:pointer}
.stop.big{width:32px;height:32px;font-size:13px}
.leaflet-popup-content-wrapper{border-radius:var(--r-m);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4}
.leaflet-popup-content b{font-family:var(--font-display);font-size:16px}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)}
.map-note{font-size:13px;color:var(--muted);margin-top:8px}

/* ---------- planning ---------- */
.block>summary .meta button{margin-top:2px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:10px;overflow:hidden}
.block>summary{list-style:none;display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;padding:14px 16px 14px 0;cursor:pointer}
.block>summary::-webkit-details-marker{display:none}
.block>summary .bar{height:100%;background:var(--c);min-height:44px}
.block>summary .ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.block>summary .ttl strong{font-family:var(--font-display);font-size:17px;font-weight:600}
.block>summary .ttl span{color:var(--muted);font-size:13px}
.block>summary .meta{text-align:right;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:640px){.block>summary{grid-template-columns:6px 1fr}.block>summary .bar{grid-row:1/3}.block>summary .meta{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap;padding-bottom:6px}}
.block[open]>summary{border-bottom:1px solid var(--line)}
.day{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.day:last-child{border-bottom:0}
.day:hover{background:var(--surface-2)}
.day .d{font-family:var(--font-display);font-weight:600;line-height:1.1}
.day .d small{display:block;font-family:var(--font-ui);font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.day .body{min-width:0}
.day .body .ty{font-size:12.5px;color:var(--muted)}
.day .body .fx{margin-top:2px}
.day .body .ex{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.day.travel{background:linear-gradient(90deg,var(--surface-2),transparent 60%)}
.day.today{box-shadow:inset 3px 0 0 var(--accent)}

/* ---------- todo ---------- */
.todo{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:start}
.todo:last-child{border-bottom:0}
.todo input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.todo .tx{cursor:pointer;min-width:0}
.todo .tx .t{font-weight:500}
.todo.done .tx .t{text-decoration:line-through;color:var(--muted);font-weight:400}
.todo .tx .m{font-size:13px;color:var(--muted);margin-top:2px}
.todo .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.cat-h{padding:14px 14px 6px;font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--muted)}
.cat-h:first-child{padding-top:4px}

/* ---------- tours ---------- */
.tour{position:relative}
.tour.chosen{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tour .kv{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;font-size:14px;margin-top:10px}
.tour .kv dt{color:var(--muted)} .tour .kv dd{margin:0;white-space:pre-line}

/* ---------- editor sheet ---------- */
dialog.sheet{border:0;padding:0;background:transparent;max-width:none;width:100%;max-height:100dvh;height:100dvh;margin:0;position:fixed;inset:0}
dialog.sheet::backdrop{background:rgba(10,18,20,.45)}
.sheet .panel{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet .panel header{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .panel .fields{padding:16px 20px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start}
.sheet .panel footer{padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:9px 11px}
.field textarea{min-height:76px;resize:vertical}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink)}
.field.check input{width:20px;height:20px;accent-color:var(--accent)}
.field .ro{padding:9px 0;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){
  .sheet .panel{width:100%;top:auto;max-height:92dvh;border-left:0;border-top:1px solid var(--line);border-radius:var(--r-l) var(--r-l) 0 0}
  .day{grid-template-columns:52px 1fr}
  .f2{grid-template-columns:1fr}
  .card{padding:16px}
  .tablewrap{margin:0 -16px;padding:0 16px}
}

/* ---------- settings ---------- */
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kvs dt{color:var(--muted)} .kvs dd{margin:0;word-break:break-all}
pre.code{background:var(--surface-2);padding:12px;border-radius:var(--r-s);overflow:auto;font-size:12.5px}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1 id="title">Azië 2027</h1>
      <small id="subtitle"></small>
    </div>
    <div class="status">
      <span id="sync"><i class="dot"></i> <span>Laden…</span></span>
      <button class="who" id="whoBtn" title="Wie ben jij?"><span id="whoName">?</span></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<dialog class="sheet" id="sheet"><div class="panel">
  <header><h2 id="sheetTitle">Bewerken</h2><button class="btn ghost sm" id="sheetClose" aria-label="Sluiten">✕</button></header>
  <form id="sheetForm" method="dialog"><div class="fields" id="sheetFields"></div>
  <footer><div><button type="button" class="btn danger ghost" id="sheetDelete" hidden>Verwijderen</button></div>
  <div class="row"><button type="button" class="btn" id="sheetCancel">Annuleren</button><button type="submit" class="btn primary">Opslaan</button></div></footer></form>
</div></dialog>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Data & sync
   ===================================================================== */
const CFG = window.PORTAL_CONFIG || {};
const SECTIONS = ['meta','days','todos','flights','flightNotes','costs','tours','transport','packing','emergency'];
const TODO_STATUS=['Open','Gepland','Afgerond'], TODO_PRIO=['Urgent','Hoog','Middel','Laag'], OWNERS=['','Luuk','Vera','Samen'];
const PRIO_N={Urgent:0,Hoog:1,Middel:2,Laag:3};
const isDone = t => /afgerond|done/i.test(t.status);
const COUNTRY_VARS = {'china':'--c-china','japan':'--c-japan','vietnam':'--c-vietnam','maleisië':'--c-maleisie','maleisie':'--c-maleisie','indonesië':'--c-indonesie','indonesie':'--c-indonesie','nederland':'--c-nederland'};
const state = { data:null, mode:'local', sb:null, dirty:new Set(), saving:false, tab:'overzicht', me:localStorage.getItem('portal.me')||'', lastBy:'', lastAt:'' };
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2,8);
const fmtEur = n => n==null||n===''||isNaN(n) ? '—' : new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const fmtDate = (iso,opts={day:'numeric',month:'short'}) => iso ? new Date(iso+'T12:00:00').toLocaleDateString('nl-NL',opts) : '';
const weekday = iso => new Date(iso+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'short'});
const todayISO = () => new Date().toISOString().slice(0,10);
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const countryVar = c => COUNTRY_VARS[(c||'').toLowerCase().split('/')[0].trim()] || '--c-nederland';

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function setSync(cls,txt){ $('#sync').innerHTML=`<i class="dot ${cls}"></i> <span>${esc(txt)}</span>`; }

async function loadSeed(){
  const r = await fetch('data.json',{cache:'no-store'});
  if(!r.ok) throw new Error('data.json niet gevonden');
  return r.json();
}
async function init(){
  renderTabs();
  if(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase){
    state.mode='supabase';
    state.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
    try{
      const {data:rows,error} = await state.sb.from('portal_sections').select('*');
      if(error) throw error;
      if(!rows.length){
        const seed = await loadSeed();
        state.data = seed;
        setSync('busy','Startdata uploaden…');
        await Promise.all(SECTIONS.map(k=>upsert(k)));
        toast('Startdata uit data.json in Supabase gezet');
      }else{
        state.data = {};
        rows.forEach(r=>{ state.data[r.key]=r.data; if(!state.lastAt||r.updated_at>state.lastAt){state.lastAt=r.updated_at;state.lastBy=r.updated_by;} });
        SECTIONS.forEach(k=>{ if(state.data[k]===undefined) state.data[k]=k==='meta'||k==='tours'?{}:[]; });
        if(!state.data.meta.start){ const seed=await loadSeed(); state.data.meta=seed.meta; }
      }
      state.sb.channel('portal').on('postgres_changes',{event:'*',schema:'public',table:'portal_sections'},p=>{
        const r=p.new; if(!r||!r.key) return;
        if(state.dirty.has(r.key)) return;              // we're mid-edit on this section; our save wins
        state.data[r.key]=r.data; state.lastAt=r.updated_at; state.lastBy=r.updated_by;
        render(); setSync('ok',`Bijgewerkt door ${r.updated_by||'iemand'}`);
      }).subscribe();
      setSync('ok','Gesynchroniseerd');
    }catch(e){
      console.error(e);
      $('#banner').innerHTML=`<div class="banner">Supabase gaf een fout (${esc(e.message||e)}). Controleer <code>config.js</code> en het SQL-script. De site draait nu lokaal.</div>`;
      state.mode='local';
    }
  }
  if(state.mode==='local'){

    state.data = local ? JSON.parse(local) : await loadSeed();

async function upsert(key){
  const row = {key, data: state.data[key], updated_at:new Date().toISOString(), updated_by: state.me||'onbekend'};
  const {error} = await state.sb.from('portal_sections').upsert(row);
  if(error) throw error;

}
let saveTimer=null;
function save(...keys){
  keys.forEach(k=>state.dirty.add(k));
  if(state.mode==='local'){
    localStorage.setItem('portal.data', JSON.stringify(state.data)); state.dirty.clear(); setSync('','Lokaal opgeslagen'); return;
  }
  setSync('busy','Opslaan…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const pending=[...state.dirty];
    try{ for(const k of pending){ await upsert(k); state.dirty.delete(k); } setSync('ok','Opgeslagen'); }
    catch(e){ console.error(e); setSync('err','Opslaan mislukt – probeer opnieuw'); toast('Opslaan mislukt: '+(e.message||e)); }
  },600);
}

function blocks(days){
  const out=[]; let cur=null;
  days.forEach((d,i)=>{
    if(cur && cur.location===d.location && cur.country===d.country){ cur.days.push(d); }
    else { cur={location:d.location,country:d.country,days:[d],start:i}; out.push(cur); }
  });
  return out;
}
function nightsByCountry(days){
  const m=new Map();
  days.forEach(d=>{ if(d.type.toLowerCase().startsWith('terugreis')) return; m.set(d.country,(m.get(d.country)||0)+1); });
  return [...m].map(([country,nights])=>({country,nights}));
}

function coordsFor(d){
  if(d.lat!=null&&d.lng!=null&&d.lat!=='') return [+d.lat,+d.lng];

function tripPhase(){

function drawMap(bl,t){

  const stops=bl.filter(b=>!/nederland/i.test(b.country)).map((b,i)=>({b,i:i+1,ll:coordsFor(b.days[0])})).filter(s=>s.ll);
  const missing=bl.filter(b=>!/nederland/i.test(b.country)&&!coordsFor(b.days[0])).map(b=>b.location);

function vTodo(){
  const d=state.data, t=todayISO(), f=state.todoFilter||(state.todoFilter={status:'open',cat:'',owner:'',q:''});

    <input type="search" id="qF" placeholder="Zoeken…" value="${esc(f.q)}">

  else {
    const group=(title,arr,cls)=>arr.length?`<div class="cat-h" ${cls?`style="color:var(--${cls})"`:''}>${title}</div>${arr.map(x=>todoRow(x,t)).join('')}`:'';
    html+=`<div class="card" style="padding:4px 0">${group('Over de deadline',overdue,'danger')}${group('Komende twee weken',soon,'warn')}${f.status==='open'?group(overdue.length||soon.length?'Daarna':'Alles',rest):rest.map(x=>todoRow(x,t)).join('')}</div>`;

    ${list.length?`<div class="card" style="padding:4px 0">${cats.map(c=>`<div class="cat-h">${esc(c)}</div>${list.filter(x=>x.category===c).map(x=>`<div class="todo ${ok(x)?'done':''}" data-p="${x.id}"><input type="checkbox" aria-label="Geregeld" ${ok(x)?'checked':''}><div class="tx"><div class="t">${esc(x.item)}</div><div class="m">${[x.type,x.who,x.note].filter(Boolean).map(esc).join(' · ')}</div></div><div class="tags">${statusChip(x.status)}</div></div>`).join('')}`).join('')}</div>`:'<div class="empty">Niets gevonden.</div>'}`;
  $('#pf').onclick=e=>{const b=e.target.closest('button'); if(b){f.status=b.dataset.s; render();}};
  $('#pq').oninput=e=>{f.q=e.target.value; render(); const q=$('#pq'); q.focus(); q.setSelectionRange(q.value.length,q.value.length);};
  $('#addP').onclick=()=>editPack(null);
  $('#view').querySelectorAll('[data-p]').forEach(el=>{ const x=pk.find(y=>y.id===el.dataset.p);
    el.querySelector('input').onchange=e=>{ x.status=e.target.checked?'Geregeld':'Nog regelen'; save('packing'); render(); };
    el.querySelector('.tx').onclick=()=>editPack(x.id); });
}
function editPack(id){
  const d=state.data; d.packing=d.packing||[];
  const x=id?d.packing.find(p=>p.id===id):{id:uid('p'),category:'',item:'',type:'Meenemen',status:'Nog regelen',who:'Beiden',note:''};
  const cats=[...new Set(d.packing.map(y=>y.category))];
  openSheet({ title:id?'Item bewerken':'Nieuw item', value:x,
    fields:[{k:'item',l:'Item',t:'text',req:true},{k:'category',l:'Categorie',t:'select',opts:cats,free:true,half:true},{k:'type',l:'Type',t:'select',opts:['Meenemen','Kopen','Regelen','Check','Installeren/testen'],free:true,half:true},
      {k:'status',l:'Status',t:'select',opts:['Nog regelen','Nog checken','Gepland','Geregeld','N.v.t.'],free:true,half:true},{k:'who',l:'Voor wie',t:'select',opts:['Beiden','Samen','Luuk','Vera'],half:true},{k:'note',l:'Opmerking',t:'textarea'}],
    onSave:v=>{ Object.assign(x,v); if(!id) d.packing.push(x); save('packing'); }, onDelete:id?()=>{ d.packing.splice(d.packing.indexOf(x),1); save('packing'); }:null });
}

/* ---------- Vervoer (China) ---------- */
function vVervoer(){
  const d=state.data, tr=d.transport||[];
  $('#view').innerHTML=`<div class="section-title"><h2>Vervoer binnen China</h2><button class="btn primary sm" id="addT">+ Traject</button></div>
  <p class="muted small" style="margin:-4px 0 14px">Per traject de voorkeur, het alternatief en wanneer je het moet regelen. Klik op een traject om het bij te werken.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">${tr.map(x=>`<div class="card tour" data-t="${x.id}" style="cursor:pointer"><div class="spread"><h3>${esc(x.leg)}</h3>${statusChip(x.status)}</div>
    <dl class="kv"><dt>Voorkeur</dt><dd><strong>${esc(x.preferred)}</strong></dd><dt>Alternatief</dt><dd>${esc(x.alternative)}</dd><dt>Reistijd</dt><dd>${esc(x.duration)}</dd><dt>Boeken</dt><dd>${esc(x.whenToBook)}</dd>${x.note?`<dt>Opmerking</dt><dd>${esc(x.note)}</dd>`:''}</dl>
    ${x.link?`<div style="margin-top:10px"><a class="btn sm" href="${esc(x.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Bron ↗</a></div>`:''}</div>`).join('')||'<div class="empty">Nog geen trajecten</div>'}</div>`;
  $('#view').querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>editTransport(el.dataset.t));
  $('#addT').onclick=()=>editTransport(null);
}
function editTransport(id){
  const d=state.data; d.transport=d.transport||[];
  const x=id?d.transport.find(t=>t.id===id):{id:uid('tr'),leg:'',preferred:'',alternative:'',duration:'',whenToBook:'',status:'In kaart gebracht',note:'',link:''};
  openSheet({ title:id?'Traject bewerken':'Nieuw traject', value:x,
    fields:[{k:'leg',l:'Traject',t:'text',req:true},{k:'preferred',l:'Voorkeur',t:'text',half:true},{k:'alternative',l:'Alternatief',t:'text',half:true},{k:'duration',l:'Indicatieve reistijd',t:'text'},{k:'whenToBook',l:'Wanneer boeken',t:'text'},
      {k:'status',l:'Status',t:'select',opts:['In kaart gebracht','Optie','Geboekt'],free:true},{k:'note',l:'Opmerking',t:'textarea'},{k:'link',l:'Bron',t:'url'}],
    onSave:v=>{ Object.assign(x,v); if(!id) d.transport.push(x); save('transport'); }, onDelete:id?()=>{ d.transport.splice(d.transport.indexOf(x),1); save('transport'); }:null });
}

/* ---------- Noodinfo ---------- */
function vNoodinfo(){
  const d=state.data, em=d.emergency||[];
  const todo=em.filter(x=>/invullen/i.test(x.status)||/NOG INVULLEN/i.test(x.org+x.phone+x.address));
  const groups=[['Privé','Eigen gegevens'],['Medisch','Medisch'],['BZ 24/7','Buitenlandse Zaken 24/7'],['Consulair','Ambassades en consulaten']];
  const row=x=>{const miss=/NOG INVULLEN/i.test(x.org+x.phone+x.address); return `<div class="todo" data-e="${x.id}" style="grid-template-columns:1fr auto;cursor:pointer"><div class="tx"><div class="t">${esc(x.subject)}${x.org&&!/NOG INVULLEN/i.test(x.org)?` <span class="muted">· ${esc(x.org)}</span>`:''}</div>
    <div class="m">${miss?'<span class="chip hoog">nog invullen</span>':`${x.phone?`📞 ${esc(x.phone)}`:''}${x.address?`<div>${esc(x.address)}</div>`:''}`}${x.source?` <a href="${esc(x.source)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">bron ↗</a>`:''}</div></div><div class="tags">${statusChip(x.status)}</div></div>`;};
  $('#view').innerHTML=`<div class="section-title"><h2>Noodinformatie</h2><button class="btn primary sm" id="addE">+ Regel</button></div>
    ${d.meta.emergencyNote?`<p class="muted small" style="margin:-4px 0 14px">${esc(d.meta.emergencyNote)}</p>`:''}
    ${todo.length?`<div class="banner">Nog ${todo.length} ${todo.length===1?'regel':'regels'} in te vullen vóór vertrek: ${todo.map(x=>esc(x.subject)).join(', ')}.</div>`:''}
    ${groups.map(([k,l])=>{const rows=em.filter(x=>x.type===k); return rows.length?`<div class="card" style="padding:4px 0;margin-bottom:12px"><div class="cat-h">${l}</div>${rows.map(row).join('')}</div>`:'';}).join('')}
    ${em.filter(x=>!groups.some(g=>g[0]===x.type)).length?`<div class="card" style="padding:4px 0"><div class="cat-h">Overig</div>${em.filter(x=>!groups.some(g=>g[0]===x.type)).map(row).join('')}</div>`:''}`;
  $('#view').querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>editEmergency(el.dataset.e));
  $('#addE').onclick=()=>editEmergency(null);
}
function editEmergency(id){
  const d=state.data; d.emergency=d.emergency||[];
  const x=id?d.emergency.find(e=>e.id===id):{id:uid('e'),type:'Privé',subject:'',org:'',phone:'',address:'',status:'Nog invullen',source:''};
  openSheet({ title:id?'Noodinformatie bewerken':'Nieuwe regel', value:x,
    fields:[{k:'subject',l:'Onderwerp',t:'text',req:true},{k:'type',l:'Type',t:'select',opts:['Privé','Medisch','BZ 24/7','Consulair'],free:true,half:true},{k:'status',l:'Status',t:'select',opts:['Nog invullen','Gereed'],half:true},
      {k:'org',l:'Organisatie / persoon',t:'text'},{k:'phone',l:'Telefoon / gegevens',t:'text'},{k:'address',l:'Adres / polis / extra',t:'textarea'},{k:'source',l:'Officiële bron',t:'url'}],
    onSave:v=>{ if(v.status==='Nog invullen'&&v.org&&v.phone&&!/NOG INVULLEN/i.test(v.org+v.phone)) v.status='Gereed'; Object.assign(x,v); if(!id) d.emergency.push(x); save('emergency'); },
    onDelete:id?()=>{ d.emergency.splice(d.emergency.indexOf(x),1); save('emergency'); }:null });
}


/* ---------- Instellingen ---------- */
function vInstellingen(){
  const d=state.data;
  $('#view').innerHTML=`<div class="grid cols-2">
  <div class="card"><h3>Jij</h3><p class="small muted">Alleen om te laten zien wie iets voor het laatst wijzigde. Geen account, geen wachtwoord.</p><div class="row"><strong>${esc(state.me||'—')}</strong><button class="btn sm" id="chMe">Wijzigen</button></div>
    <h3 style="margin-top:22px">Weergave</h3><div class="seg" id="theme" style="margin-top:8px">${[['auto','Automatisch'],['light','Licht'],['dark','Donker']].map(([k,l])=>`<button aria-pressed="${(localStorage.getItem('portal.theme')||'auto')===k}" data-t="${k}">${l}</button>`).join('')}</div></div>
  <div class="card"><h3>Opslag</h3><dl class="kvs" style="margin-top:10px"><dt>Modus</dt><dd>${state.mode==='supabase'?'Supabase (gedeeld)':'Lokaal (alleen deze browser)'}</dd><dt>Project</dt><dd>${esc(CFG.supabaseUrl||'—')}</dd><dt>Laatste wijziging</dt><dd>${state.lastBy?esc(state.lastBy)+' · '+new Date(state.lastAt).toLocaleString('nl-NL'):'—'}</dd></dl>
    <div class="row" style="margin-top:14px"><button class="btn sm" id="exp">Download back-up (data.json)</button><label class="btn sm">Herstel uit back-up <input type="file" accept="application/json" id="imp" hidden></label></div>
    <p class="small muted" style="margin:12px 0 0">Tip: download af en toe een back-up. Herstellen overschrijft alles (ook bij Vera). Een nieuwe <code>data.json</code> uit de Excel laad je ook via <em>Herstel uit back-up</em>.</p></div>
  <div class="card"><h3>Reis</h3><form id="metaForm" style="margin-top:10px;display:grid;gap:12px"><div class="field"><label>Titel</label><input name="title" value="${esc(d.meta.title)}"></div><div class="field"><label>Vertrekdatum (verschuift alle dagen)</label><input type="date" name="start" value="${esc(d.meta.start)}"></div><button class="btn primary sm" style="justify-self:start">Opslaan</button></form></div>
  <div class="card"><h3>Over dit portaal</h3><p class="small muted">Gebouwd uit <em>Sabbatical_Planning.xlsx</em>. Statische site op GitHub Pages; data in één Supabase-tabel (<code>portal_sections</code>). Zie de README in de repo voor installatie en het SQL-script.</p></div>
  </div>`;
  $('#chMe').onclick=()=>{pickMe();render();};
  $('#theme').onclick=e=>{const b=e.target.closest('button'); if(!b) return; const t=b.dataset.t; localStorage.setItem('portal.theme',t); applyTheme(); render();};
  $('#exp').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})); a.download=`azie2027-backup-${todayISO()}.json`; a.click(); };
  $('#imp').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(!j.days||!j.todos) throw new Error('Geen geldige back-up'); if(!confirm('Alles overschrijven met deze back-up?')) return; state.data=j; save(...SECTIONS); render(); toast('Back-up hersteld'); }catch(err){ toast(err.message); } };
  $('#metaForm').onsubmit=e=>{ e.preventDefault(); const fd=new FormData(e.target); d.meta.title=fd.get('title'); const ns=fd.get('start'); if(ns&&ns!==d.meta.start){ d.meta.start=ns; renumber(); save('days'); } save('meta'); render(); toast('Opgeslagen'); };
}
function applyTheme(){ const t=localStorage.getItem('portal.theme')||'auto'; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }
applyTheme();

/* =====================================================================
   Generic editor sheet
   ===================================================================== */
const sheet=$('#sheet'); let sheetCtx=null;
function openSheet(ctx){
  sheetCtx=ctx; $('#sheetTitle').textContent=ctx.title;
  const v=ctx.value;
  const html=[]; let i=0;
  while(i<ctx.fields.length){
    const f=ctx.fields[i];
    if(f.half && ctx.fields[i+1]?.half){ html.push(`<div class="f2">${fieldHtml(f,v)}${fieldHtml(ctx.fields[i+1],v)}</div>`); i+=2; }
    else { html.push(fieldHtml(f,v)); i++; }
  }
  if(ctx.extra) html.push(`<div class="row">${ctx.extra.map((e,j)=>`<button type="button" class="btn sm" data-extra="${j}">${esc(e.label)}</button>`).join('')}</div>`);
  $('#sheetFields').innerHTML=html.join('');
  $('#sheetFields').querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{ sheet.close(); ctx.extra[+b.dataset.extra].fn(); render(); });
  $('#sheetDelete').hidden=!ctx.onDelete;
  sheet.showModal();
  const first=$('#sheetFields').querySelector('input:not([type=checkbox]),textarea,select'); first?.focus();
}
function fieldHtml(f,v){
  const val=v[f.k]??'';
  if(f.t==='check') return `<div class="field check"><input type="checkbox" id="f_${f.k}" name="${f.k}" ${val?'checked':''}><label for="f_${f.k}">${esc(f.l)}</label></div>`;
  let inp;
  if(f.t==='textarea') inp=`<textarea name="${f.k}">${esc(val)}</textarea>`;
  else if(f.t==='select'){ const opts=[...new Set([...(f.opts||[]), ...(val!==''&&!f.opts.includes(val)?[val]:[])])]; inp=f.free?`<input name="${f.k}" list="dl_${f.k}" value="${esc(val)}"><datalist id="dl_${f.k}">${opts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:`<select name="${f.k}">${opts.map(o=>`<option ${o===val?'selected':''} value="${esc(o)}">${esc(o)||'—'}</option>`).join('')}</select>`; }
  else inp=`<input type="${f.t}" name="${f.k}" value="${esc(val)}" ${f.req?'required':''} ${f.t==='number'?'step="0.01" inputmode="decimal"':''}>`;
  return `<div class="field"><label>${esc(f.l)}</label>${inp}</div>`;
}
$('#sheetForm').onsubmit=e=>{
  e.preventDefault(); if(!sheetCtx) return;
  const fd=new FormData(e.target), out={};
  sheetCtx.fields.forEach(f=>{ if(f.t==='check') out[f.k]=fd.has(f.k); else if(f.t==='number'){ const s=fd.get(f.k); out[f.k]=s===''?null:+s; } else out[f.k]=(fd.get(f.k)??'').toString().trim(); });
  sheetCtx.onSave(out); sheet.close(); render(); toast('Opgeslagen');
};
$('#sheetDelete').onclick=()=>{ if(sheetCtx?.onDelete && confirm('Weet je het zeker?')){ sheetCtx.onDelete(); sheet.close(); render(); toast('Verwijderd'); } };
$('#sheetClose').onclick=$('#sheetCancel').onclick=()=>sheet.close();
sheet.addEventListener('click',e=>{ if(e.target===sheet) sheet.close(); });

/* boot */
if(location.hash && TABS.some(t=>t[0]===location.hash.slice(1))) state.tab=location.hash.slice(1);
init().catch(e=>{ console.error(e); $('#view').innerHTML=`<div class="empty">Kon de data niet laden: ${esc(e.message||e)}</div>`; setSync('err','Fout'); });
</script>
</body>
